name: Inference CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DGLBACKEND: pytorch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-inference.txt

      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-inference.txt pytest

      - name: Run inference tests
        run: python -m pytest -q
